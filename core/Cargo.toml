[package]
name = "hermes_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
pulldown-cmark = { version = "0.13.6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
